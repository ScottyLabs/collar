[project]
site_name = "Collar"
site_url = "https://docs.collar.scottylabs.org"
repo_url = "https://git.cmu.dev/ScottyLabs/collar"
docs_dir = "docs"
edit_uri = "_edit/main/docs/"
nav = [
  { "Collar" = "index.md" },
  { "Guides" = [
    { "Installation and first steps" = "getting-started.md" },
    { "Agent setup and skill" = "agents.md" },
    { "Bundled skill source" = "skill.md" },
    { "Pull requests" = "guides/pull-requests.md" },
    { "CI and previews" = "guides/actions-and-previews.md" },
    { "Local development" = "guides/development.md" },
    { "ScottyLabs projects" = "guides/scottylabs.md" },
    { "Repository work" = "guides/repository-work.md" },
    { "Shell completions" = "guides/completions.md" },
    { "Troubleshooting" = "troubleshooting.md" },
  ] },
  { "Reference" = [
    { "Configuration and authentication" = "reference/configuration.md" },
    { "Automation" = "reference/automation.md" },
    { "Commands" = [
      "reference/commands/index.md",
      { "Agent skill" = "reference/commands/skill.md" },
      { "Status" = "reference/commands/status.md" },
      { "Authentication" = "reference/commands/auth.md" },
      { "Pull requests" = "reference/commands/pr.md" },
      { "Repositories" = "reference/commands/repo.md" },
      { "Issues" = "reference/commands/issue.md" },
      { "Labels" = "reference/commands/label.md" },
      { "Releases" = "reference/commands/release.md" },
      { "Actions" = "reference/commands/actions.md" },
      { "Workflows" = "reference/commands/workflow.md" },
      { "Kennel" = "reference/commands/kennel.md" },
      { "Projects" = "reference/commands/project.md" },
      { "Governance" = "reference/commands/governance.md" },
      { "Documentation" = "reference/commands/docs.md" },
      { "Changelog" = "reference/commands/changelog.md" },
      { "Development" = "reference/commands/dev.md" },
      { "Checks" = "reference/commands/check.md" },
      { "Secrets" = "reference/commands/secrets.md" },
      { "Doctor" = "reference/commands/doctor.md" },
      { "RFCs" = "reference/commands/rfc.md" },
      { "Configuration" = "reference/commands/config.md" },
      { "API" = "reference/commands/api.md" },
      { "Completions" = "reference/commands/completion.md" },
    ] },
  ] },
  { "Project" = [
    { "Accepted RFC" = "design/collar.md" },
  ] },
]

[project.theme]
features = ["content.action.edit"]

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"
