[package]
name = "collar"
description = "ScottyLabs forge, governance, and development tools"
readme = "README.md"
version = "0.1.0"
edition = "2024"
repository = "https://git.cmu.dev/ScottyLabs/collar"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = { version = "4.6.11", default-features = false }
console = "0.16.6"
dialoguer = { version = "0.12.0", default-features = false, features = [
  "fuzzy-select",
] }
directories = "6.0.0"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
pulldown-cmark = "0.13.4"
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "json",
  "rustls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.10"
sigpipe = "0.1.3"
tempfile = "3.27.0"
toml = "1.1.8"
toml_edit = "0.25.17"
url = { version = "2.5.8", features = ["serde"] }
